SecRuleEngine On
SecRequestBodyAccess On
SecAuditEngine Off
SecDebugLog /dev/null
SecDebugLogLevel 0
SecRequestBodyLimit 8388608
SecRequestBodyNoFilesLimit 8388608
SecRequestBodyJsonDepthLimit 4096
SecRule REQUEST_HEADERS:Content-Type "^application/json$" "id:901001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
