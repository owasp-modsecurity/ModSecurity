[tool:pytest]
minversion = 7.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests for operators, transformations, actions
    regression: Integration tests with Apache server  
    apache: Tests that require Apache server
    slow: Tests that take a long time to run
    skip_ci: Skip in CI environment
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 