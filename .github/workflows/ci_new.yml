name: Quality Assurance

on:
  push:
  pull_request:

jobs:
  build-modsecurity-v3:
    name: ModSecurity v3 (warn-only hardening build, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CC: gcc
      CXX: g++
      COMMON_CC_OPT: "-O2 -pipe -fstack-protector-strong -fstack-clash-protection -ffunction-sections -fdata-sections"
      COMMON_LD_OPT: "-Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack -Wl,--as-needed -Wl,--gc-sections"
      PIC_CC_OPT: "-fPIC"
      MODSECURITY_CC_OPT: "-Wall -Wextra -Wformat -Wformat-security"
      MODSECURITY_CXX_OPT: "-Wall -Wextra -Wformat -Wformat-security"
      MODSECURITY_LD_OPT: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi

          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"
          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package"
            exit 1
          fi

          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            autoconf automake libtool pkg-config bison flex \
            libyajl-dev libcurl4-openssl-dev liblmdb-dev \
            ${{ steps.detect_lua.outputs.lua_pkg }} \
            libmaxminddb-dev libpcre2-dev libxml2-dev libfuzzy-dev \
            binutils pcre2-utils python3 python3-venv

      - name: Build preparation
        run: ./build.sh

      - name: Configure ModSecurity v3 flags
        shell: bash
        run: |
          set -euo pipefail

          echo "CFLAGS=${COMMON_CC_OPT} ${PIC_CC_OPT} ${MODSECURITY_CC_OPT}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${COMMON_CC_OPT} ${PIC_CC_OPT} ${MODSECURITY_CXX_OPT}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-D_FORTIFY_SOURCE=3" >> "$GITHUB_ENV"
          echo "LDFLAGS=${COMMON_LD_OPT}${MODSECURITY_LD_OPT:+ ${MODSECURITY_LD_OPT}}" >> "$GITHUB_ENV"

      - name: Print toolchain and build configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "compiler version:"
          ${CC} --version
          echo
          echo "linker version:"
          ${CC} -Wl,--version 2>&1 | sed -n '1p' || ld --version 2>&1 | sed -n '1p'
          echo
          echo "CFLAGS=${CFLAGS}"
          echo "CXXFLAGS=${CXXFLAGS}"
          echo "CPPFLAGS=${CPPFLAGS}"
          echo "LDFLAGS=${LDFLAGS}"
          echo "configure options: --enable-assertions=yes"
          echo "Note: no LuaJIT rpath and no nginx/OpenResty-specific flags are used in this job."

      - name: Configure
        run: ./configure --enable-assertions=yes

      - uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master (2026-03-12)

      - name: Build (verbose)
        run: make -j "$(nproc)" V=1

      - name: Verify binary hardening
        shell: bash
        run: |
          set -euo pipefail
          LIB="src/.libs/libmodsecurity.so"
          if [ ! -f "$LIB" ]; then
            echo "::error::Shared library not found: $LIB"
            exit 1
          fi

          PROGRAM_HEADERS="$(readelf -lW "$LIB")"
          DYNAMIC_SECTION="$(readelf -dW "$LIB")"
          SYMBOLS="$(readelf -Ws "$LIB")"

          check() {
            local description="$1"
            shift
            if ! "$@"; then
              echo "::error::Missing hardening property: $description"
              exit 1
            fi
            echo "Verified: $description"
          }

          check "GNU_RELRO segment" grep -Eq "^[[:space:]]*GNU_RELRO[[:space:]]" <<< "$PROGRAM_HEADERS"
          check "Immediate binding (BIND_NOW)" grep -Eq "\(BIND_NOW\)|\(FLAGS\).*BIND_NOW|\(FLAGS_1\).*[[:space:]]NOW([[:space:]]|$)" <<< "$DYNAMIC_SECTION"
          check "Non-executable GNU_STACK" awk '
            $1 == "GNU_STACK" {
              found = 1
              for (i = 7; i < NF; i++)
                if ($i ~ /E/) executable = 1
            }
            END { exit !(found && !executable) }
          ' <<< "$PROGRAM_HEADERS"
          # An imported stack-check symbol indicates stack canary instrumentation.
          check "Stack protector instrumentation" grep -Eq "[[:space:]]UND[[:space:]]+__stack_chk_fail(@|[[:space:]]|$)" <<< "$SYMBOLS"


      - name: Run unit and regression tests
        id: hardening_tests
        run: make check VERBOSE=1

      - name: Upload hardening test logs
        if: failure() && steps.hardening_tests.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: modsecurity-v3-hardening-logs-${{ matrix.os }}
          path: |
            test-suite.log
            test/test-cases/**/*.log
          if-no-files-found: warn
          retention-days: 14

  # Keep sanitizer instrumentation separate from the hardening build (see #3779).
  build-modsecurity-v3-asan:
    name: ModSecurity v3 (AddressSanitizer, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CC: gcc
      CXX: g++
      CFLAGS: "-O1 -g -fPIC -fsanitize=address -fno-omit-frame-pointer -U_FORTIFY_SOURCE"
      CXXFLAGS: "-O1 -g -fPIC -fsanitize=address -fno-omit-frame-pointer -U_FORTIFY_SOURCE"
      LDFLAGS: "-fsanitize=address"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi

          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"
          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package"
            exit 1
          fi

          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            autoconf automake libtool pkg-config bison flex \
            libyajl-dev libcurl4-openssl-dev liblmdb-dev \
            ${{ steps.detect_lua.outputs.lua_pkg }} \
            libmaxminddb-dev libpcre2-dev libxml2-dev libfuzzy-dev \
            pcre2-utils python3 python3-venv

      - name: Print toolchain and sanitizer configuration
        run: |
          "$CC" --version
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "LDFLAGS=$LDFLAGS"
          echo "configure options: --enable-assertions=yes"

      - name: Build preparation
        run: ./build.sh

      - name: Configure
        run: ./configure --enable-assertions=yes

      - name: Build
        run: make -j "$(nproc)"

      - name: Run unit and regression tests with ASan
        id: asan_tests
        # Keep diagnostics non-blocking until the known leaks in #3779 are fixed.
        continue-on-error: true
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:log_path=${{ runner.temp }}/modsecurity-asan/asan"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modsecurity-asan"
          echo "ASAN_OPTIONS=$ASAN_OPTIONS"
          status=0
          make check VERBOSE=1 || status=$?

          # The test wrapper can mask process failures (e.g. during countall).
          # Check per-process sanitizer reports independently of make check.
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/modsecurity-asan/asan.*)
          if (( ${#reports[@]} > 0 )); then
            for report in "${reports[@]}"; do
              echo "=== $report ==="
              cat "$report"
            done
            status=1
          fi
          exit "$status"

      - name: Report sanitizer test failures
        if: ${{ !cancelled() && steps.asan_tests.outcome == 'failure' }}
        run: |
          echo "::warning::AddressSanitizer test run reported failures; see the test logs and issue #3779."

      - name: Upload sanitizer test logs
        if: ${{ !cancelled() && steps.asan_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: modsecurity-v3-asan-logs-${{ matrix.os }}
          path: |
            test-suite.log
            test/test-cases/**/*.log
            ${{ runner.temp }}/modsecurity-asan/asan.*
          if-no-files-found: warn
          retention-days: 14

  # Keep legacy Ubuntu 22.04 coverage, including x32, in a self-contained job.
  # Remove this job when the legacy matrix is no longer needed.
  build-linux-old:
    name: Linux (old, ${{ matrix.os }}, ${{ matrix.platform.label }}, ${{ matrix.compiler.label }}, ${{ matrix.configure.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        platform:
          - {label: "x64", arch: "amd64", configure: ""}
          - {label: "x32", arch: "i386", configure: "PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig CFLAGS=-m32 CXXFLAGS=-m32 LDFLAGS=-m32"}
        compiler:
          - {label: "gcc", cc: "gcc", cxx: "g++"}
          - {label: "clang", cc: "clang", cxx: "clang++"}
        configure:
          - {label: "with parser generation", opt: "--enable-parser-generation" }
          - {label: "wo curl",    opt: "--without-curl" }
          - {label: "wo lua",     opt: "--without-lua" }
          - {label: "wo maxmind", opt: "--without-maxmind" }
          - {label: "wo libxml",  opt: "--without-libxml" }
          - {label: "wo geoip",   opt: "--without-geoip" }
          - {label: "wo ssdeep",  opt: "--without-ssdeep" }
          - {label: "with lmdb",  opt: "--with-lmdb" }
          - {label: "with pcre", opt: "--with-pcre" }
        exclude:
          - platform: {label: "x32"}
            configure: {label: "wo geoip"}
          - platform: {label: "x32"}
            configure: {label: "wo ssdeep"}
    steps:
      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y -qq

          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"

          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi

          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"

          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package"
            exit 1
          fi

          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"

      - name: Setup Dependencies (common)
        run: |
          sudo dpkg --add-architecture ${{ matrix.platform.arch }}
          sudo apt-get update -y -qq
          sudo apt-get install -y libyajl-dev:${{ matrix.platform.arch }} \
                                  libcurl4-openssl-dev:${{ matrix.platform.arch }} \
                                  liblmdb-dev:${{ matrix.platform.arch }} \
                                  ${{ steps.detect_lua.outputs.lua_pkg }}:${{ matrix.platform.arch }} \
                                  libmaxminddb-dev:${{ matrix.platform.arch }} \
                                  libpcre2-dev:${{ matrix.platform.arch }} \
                                  pcre2-utils:${{ matrix.platform.arch }} \
                                  bison flex python3 python3-venv
      - name: Setup Dependencies (x32)
        if: ${{ matrix.platform.label == 'x32' }}
        run: |
          sudo apt-get install -y g++-multilib
          sudo apt-get install -y libxml2-dev:${{ matrix.platform.arch }} \
                                  libpcre3-dev:${{ matrix.platform.arch }}
      - name: Setup Dependencies (x64)
        if: ${{ matrix.platform.label == 'x64' }}
        run: |
          sudo apt-get install -y libfuzzy-dev:${{ matrix.platform.arch }} \
                                  libxml2-dev:${{ matrix.platform.arch }} \
                                  libpcre3-dev:${{ matrix.platform.arch }}
                                  
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: build.sh
        run: ./build.sh
      - name: configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: ./configure ${{ matrix.platform.configure }} ${{ matrix.configure.opt }} --enable-assertions=yes
      - name: Force parser regeneration
        # make only regenerates the parser when the grammar is newer than the
        # committed output, which after a checkout depends on file times
        if: ${{ matrix.configure.opt == '--enable-parser-generation' }}
        run: |
          bison --version | head -n 1
          flex --version
          touch src/parser/seclang-parser.yy src/parser/seclang-scanner.ll
      - uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master (2026-03-12)
      - name: make
        run: make -j "$(nproc)"
      - name: check
        run: make check

  build-linux:
    name: Linux (${{ matrix.os }}, ${{ matrix.platform.label }}, ${{ matrix.compiler.label }}, ${{ matrix.configure.label }})

    # Ubuntu 24.04 does not provide native 32-bit (i386) installation images.
    # Only amd64 (x86_64) is officially supported. 32-bit has been removed from this matrix.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04,ubuntu-26.04]
        platform:
          - { label: "x64", arch: "amd64", configure: "" }

        compiler:
          - { label: "gcc",   cc: "gcc",   cxx: "g++" }
          - { label: "clang", cc: "clang", cxx: "clang++" }

        configure:
          - { label: "with parser generation", opt: "--enable-parser-generation" }
          - { label: "without curl",    opt: "--without-curl" }
          - { label: "without lua",     opt: "--without-lua" }
          - { label: "without maxmind", opt: "--without-maxmind" }
          - { label: "without libxml",  opt: "--without-libxml" }
          - { label: "without geoip",   opt: "--without-geoip" }
          - { label: "without ssdeep",  opt: "--without-ssdeep" }
          - { label: "with lmdb",       opt: "--with-lmdb" }
          - { label: "with pcre2 (default)", opt: "" }
          - { label: "with pcre",        opt: "--with-pcre" }
        exclude:
          # Ubuntu 26.04 no longer provides the PCRE1 development package.
          - os: ubuntu-26.04
            configure: { label: "with pcre", opt: "--with-pcre" }

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y -qq

          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"

          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi

          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"

          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package"
            exit 1
          fi

          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"


      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            libyajl-dev \
            libcurl4-openssl-dev \
            liblmdb-dev \
            ${{ steps.detect_lua.outputs.lua_pkg }} \
            libmaxminddb-dev \
            libpcre2-dev \
            libxml2-dev \
            libfuzzy-dev \
            pcre2-utils \
            bison \
            flex \
            pkg-config \
            python3 \
            python3-venv

      - name: Install PCRE1 development package
        if: matrix.os != 'ubuntu-26.04'
        run: sudo apt-get install -y libpcre3-dev

      - name: Show Lua installation
        run: |
          which lua || true
          lua -v || true
          dpkg -l | grep lua || true

      - name: Run build preparation script
        run: ./build.sh

      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: ./configure ${{ matrix.platform.configure }} ${{ matrix.configure.opt }} --enable-assertions=yes

      - name: Force parser regeneration
        # make only regenerates the parser when the grammar is newer than the
        # committed output, which after a checkout depends on file times
        if: ${{ matrix.configure.opt == '--enable-parser-generation' }}
        run: |
          bison --version | head -n 1
          flex --version
          touch src/parser/seclang-parser.yy src/parser/seclang-scanner.ll

      - uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master (2026-03-12)

      - name: Compile
        run: make -j "$(nproc)"

      - name: Run tests
        run: make check

  build-macos:
    name: macOS (${{ matrix.os }}, ${{ matrix.configure.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-15,macos-26]
        configure:
          - { label: "with parser generation", opt: "--enable-parser-generation" }
          - { label: "without curl",    opt: "--without-curl" }
          - { label: "without lua",     opt: "--without-lua" }
          - { label: "without maxmind", opt: "--without-maxmind" }
          - { label: "without libxml",  opt: "--without-libxml" }
          - { label: "without geoip",   opt: "--without-geoip" }
          - { label: "without ssdeep",  opt: "--without-ssdeep" }
          - { label: "with lmdb",       opt: "--with-lmdb" }
          - { label: "with pcre2 (default)", opt: "" }
          - { label: "with pcre",       opt: "--with-pcre" }

        include:
          - os: xcode-27
            configure: { label: "with pcre2 (default)", opt: "" }
          - os: xcode-27
            configure: { label: "with parser generation", opt: "--enable-parser-generation" }

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
          
      - name: Install dependencies
        # curl and pcre2 are typically already available in the macOS runner image
        run: |
          brew install autoconf \
                       automake \
                       libtool \
                       yajl \
                       lmdb \
                       lua \
                       libmaxminddb \
                       libxml2 \
                       ssdeep \
                       pcre \
                       bison \
                       flex

      - name: Use the Homebrew bison
        # Homebrew installs bison keg-only; without this, configure finds
        # the bison 2.3 that comes with macOS
        run: echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Run build preparation script
        run: ./build.sh

      - name: Configure
        run: ./configure ${{ matrix.configure.opt }} --enable-assertions=yes

      - name: Force parser regeneration
        # make only regenerates the parser when the grammar is newer than the
        # committed output, which after a checkout depends on file times
        if: ${{ matrix.configure.opt == '--enable-parser-generation' }}
        run: |
          bison --version | head -n 1
          flex --version
          touch src/parser/seclang-parser.yy src/parser/seclang-scanner.ll

      - uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master (2026-03-12)

      - name: Compile
        run: make -j "$(sysctl -n hw.logicalcpu)"

      - name: Run tests
        run: make check

  build-windows:
    name: Windows (${{ matrix.platform.label }}, ${{ matrix.configure.label }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: "x64", arch: "x86_64" }
        configuration: [Release]
        configure:
          - { label: "full",             opt: "" }
          - { label: "without curl",     opt: "-DWITH_CURL=OFF" }
          - { label: "without lua",      opt: "-DWITH_LUA=OFF" }
          - { label: "without maxmind",  opt: "-DWITH_MAXMIND=OFF" }
          - { label: "without libxml",   opt: "-DWITH_LIBXML2=OFF" }
          - { label: "with lmdb",        opt: "-DWITH_LMDB=ON" }

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install Conan package manager
        run: |
          pip3 install conan --upgrade
          conan profile detect

      - uses: ammaraskar/msvc-problem-matcher@47189a176388253d16c6f0b79eee6274512b761a # master (2026-09-05)

      - name: Build project
        shell: cmd
        run: vcbuild.bat ${{ matrix.configuration }} ${{ matrix.platform.arch }} NO_ASAN "${{ matrix.configure.opt }}"

      - name: Prepare test environment
        working-directory: build\win32\build\${{ matrix.configuration }}
        env:
          BASE_DIR: ..\..\..\..
        shell: cmd
        run: |
          copy unit_tests.exe %BASE_DIR%\test
          copy regression_tests.exe %BASE_DIR%\test
          copy libModSecurity.dll %BASE_DIR%\test
          copy %BASE_DIR%\unicode.mapping %BASE_DIR%\test
          md \tmp
          md \bin
          copy "C:\Program Files\Git\usr\bin\echo.exe" \bin
          copy "C:\Program Files\Git\usr\bin\echo.exe" \bin\echo

      - name: Disable unsupported tests on Windows
        working-directory: test\test-cases\regression
        shell: cmd
        run: |
          jq "map(if .title == \"Test match variable (1/n)\" then .enabled = 0 else . end)" issue-2423-msg-in-chain.json > tmp.json && move /Y tmp.json issue-2423-msg-in-chain.json
          jq "map(if .title == \"Test match variable (2/n)\" then .enabled = 0 else . end)" issue-2423-msg-in-chain.json > tmp.json && move /Y tmp.json issue-2423-msg-in-chain.json
          jq "map(if .title == \"Test match variable (3/n)\" then .enabled = 0 else . end)" issue-2423-msg-in-chain.json > tmp.json && move /Y tmp.json issue-2423-msg-in-chain.json
          jq "map(if .title == \"Variable offset - FILES_NAMES\" then .enabled = 0 else . end)" offset-variable.json > tmp.json && move /Y tmp.json offset-variable.json

      - name: Run tests
        working-directory: build\win32\build
        run: ctest -C ${{ matrix.configuration }} --output-on-failure

  cppcheck:
    name: Static analysis (cppcheck)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install cppcheck
        run: |
          brew install autoconf automake libtool cppcheck libmaxminddb yajl lua lmdb ssdeep

      - name: Configure project
        run: |
          ./build.sh
          ./configure

      - name: Run cppcheck
        run: make check-static

  cppcheck-linux:
    name: Static analysis (cppcheck, Linux, debian:sid)
    runs-on: ubuntu-latest
    container: debian:sid

    steps:
      - name: Install basic tools
        run: |
          apt-get update
          apt-get install -y git

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
        
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
          
      - name: Detect latest Lua packages
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail

          apt-get update

          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"

          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi

          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"

          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua dev package"
            printf '%s\n' "$CANDIDATES"
            exit 1
          fi

          BEST_VER="$(printf '%s\n' "$BEST_PKG" | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1/')"
          LUA_PKG="lua$BEST_VER"

          echo "lua_dev_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "lua_pkg=$LUA_PKG" >> "$GITHUB_OUTPUT"

          echo "Using dev package: $BEST_PKG"
          echo "Using interpreter: $LUA_PKG"

      - name: Install dependencies (v2 style)
        run: |
          apt-get install -y \
            autoconf \
            automake \
            build-essential \
            libtool \
            pkg-config \
            cppcheck \
            libyajl-dev \
            libcurl4-openssl-dev \
            liblmdb-dev \
            ${{ steps.detect_lua.outputs.lua_dev_pkg }} \
            ${{ steps.detect_lua.outputs.lua_pkg }} \
            libmaxminddb-dev \
            libpcre2-dev \
            libxml2-dev \
            libfuzzy-dev \
            pcre2-utils \
            bison \
            flex \
            python3 \
            python3-venv
            
      - name: Show Lua installation
        run: |
          which lua || true
          lua -v || true
          dpkg -l | grep lua || true
            
      - name: Run build preparation script
        run: ./build.sh

      - name: Configure project
        run: ./configure

      - name: Run cppcheck
        run: make check-static
