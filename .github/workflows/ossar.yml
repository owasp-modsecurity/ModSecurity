name: OSSAR (best-effort)

on:
  schedule:
    - cron: "15 4 * * 1"   # Weekly, nicht auf PRs
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ossar:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Reduce SARIF to a single run (GitHub Code Scanning requirement)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ".gdn/msdo.sarif" ]; then
            jq '.runs = [ .runs[0] ]' .gdn/msdo.sarif > msdo.single.sarif
          else
            echo "No .gdn/msdo.sarif found"
            exit 1
          fi


      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: msdo.single.sarif
          category: ossar

