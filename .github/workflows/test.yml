          - label: "auto/auto prefer=auto mode=events debug"
            json_c: "auto"
            json_cxx: "auto"
            json_prefer: "auto"
            json_mode: "events"
            json_debug: true
            expect_configure_failure: false

          # ---------------------------------
          # POSITIVE: explicit valid system C backends
          # ---------------------------------
          - label: "json-c + none system auto"
            json_c: "json-c"
            json_cxx: "none"
            json_prefer: "system"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: false

          - label: "json-c + none system dom"
            json_c: "json-c"
            json_cxx: "none"
            json_prefer: "system"
            json_mode: "dom"
            json_debug: false
            expect_configure_failure: false

          - label: "jansson + none system events"
            json_c: "jansson"
            json_cxx: "none"
            json_prefer: "system"
            json_mode: "events"
            json_debug: false
            expect_configure_failure: false

          - label: "cjson + none system dom"
            json_c: "cjson"
            json_cxx: "none"
            json_prefer: "system"
            json_mode: "dom"
            json_debug: false
            expect_configure_failure: false

          - label: "cjson + none auto auto"
            json_c: "cjson"
            json_cxx: "none"
            json_prefer: "auto"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: false

          # ---------------------------------
          # POSITIVE: explicit no-json mode
          # ---------------------------------
          - label: "none + none system auto"
            json_c: "none"
            json_cxx: "none"
            json_prefer: "system"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: false

          - label: "none + none auto dom"
            json_c: "none"
            json_cxx: "none"
            json_prefer: "auto"
            json_mode: "dom"
            json_debug: false
            expect_configure_failure: false

          # ---------------------------------
          # NEGATIVE: explicit unsupported system C++ backends
          # ---------------------------------
          - label: "json-c + nlohmannjson system fail"
            json_c: "json-c"
            json_cxx: "nlohmannjson"
            json_prefer: "system"
            json_mode: "dom"
            json_debug: false
            expect_configure_failure: true

          - label: "json-c + jsoncpp system fail"
            json_c: "json-c"
            json_cxx: "jsoncpp"
            json_prefer: "system"
            json_mode: "dom"
            json_debug: false
            expect_configure_failure: true

          - label: "jansson + simdjson system fail"
            json_c: "jansson"
            json_cxx: "simdjson"
            json_prefer: "system"
            json_mode: "events"
            json_debug: false
            expect_configure_failure: true

          - label: "cjson + glaze system fail"
            json_c: "cjson"
            json_cxx: "glaze"
            json_prefer: "system"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: true

          - label: "none + nlohmannjson system fail"
            json_c: "none"
            json_cxx: "nlohmannjson"
            json_prefer: "system"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: true

          - label: "none + jsoncpp system fail"
            json_c: "none"
            json_cxx: "jsoncpp"
            json_prefer: "system"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: true

          - label: "none + simdjson system fail"
            json_c: "none"
            json_cxx: "simdjson"
            json_prefer: "system"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: true

          # ---------------------------------
          # NEGATIVE: bundled backends not available in CI
          # ---------------------------------
          - label: "yyjson + auto bundled fail"
            json_c: "yyjson"
            json_cxx: "auto"
            json_prefer: "bundled"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: true

          - label: "yyjson + glaze bundled fail"
            json_c: "yyjson"
            json_cxx: "glaze"
            json_prefer: "bundled"
            json_mode: "events"
            json_debug: false
            expect_configure_failure: true

          - label: "auto + glaze bundled fail"
            json_c: "auto"
            json_cxx: "glaze"
            json_prefer: "bundled"
            json_mode: "dom"
            json_debug: false
            expect_configure_failure: true

          - label: "auto + nlohmannjson bundled fail"
            json_c: "auto"
            json_cxx: "nlohmannjson"
            json_prefer: "bundled"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: true

          # ---------------------------------
          # NEGATIVE: impossible mixed policy cases
          # ---------------------------------
          - label: "yyjson + none system fail"
            json_c: "yyjson"
            json_cxx: "none"
            json_prefer: "system"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: true

          - label: "json-c + glaze bundled fail"
            json_c: "json-c"
            json_cxx: "glaze"
            json_prefer: "bundled"
            json_mode: "events"
            json_debug: false
            expect_configure_failure: true

          - label: "jansson + nlohmannjson bundled fail"
            json_c: "jansson"
            json_cxx: "nlohmannjson"
            json_prefer: "bundled"
            json_mode: "dom"
            json_debug: false
            expect_configure_failure: true

          # ---------------------------------
          # POSITIVE: more auto behavior probes
          # ---------------------------------
          - label: "auto + none system auto"
            json_c: "auto"
            json_cxx: "none"
            json_prefer: "system"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: false

          - label: "auto + none auto events"
            json_c: "auto"
            json_cxx: "none"
            json_prefer: "auto"
            json_mode: "events"
            json_debug: false
            expect_configure_failure: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq

          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
