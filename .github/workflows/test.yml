          )"

          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            libyajl-dev \
            libcurl4-openssl-dev \
            liblmdb-dev \
            ${{ steps.detect_lua.outputs.lua_pkg }} \
            libmaxminddb-dev \
            libpcre2-dev \
            libxml2-dev \
            libfuzzy-dev \
            pcre2-utils \
            libpcre3-dev \
            bison \
            flex \
            pkg-config \
            python3 \
            python3-venv \
            libjson-c-dev \
            libjansson-dev \
            libcjson-dev \
            libjsoncpp-dev \
            rapidjson-dev \
            nlohmann-json3-dev \
            libsimdjson-dev

      - name: Run build preparation script
        run: ./build.sh

      - name: Configure
        id: configure_json
        shell: bash
        run: |
          set +e

          EXTRA_OPTS=()
          EXTRA_OPTS+=("--with-json-c=${{ matrix.json_c }}")
          EXTRA_OPTS+=("--with-json-cxx=${{ matrix.json_cxx }}")
          EXTRA_OPTS+=("--with-json-prefer=${{ matrix.json_prefer }}")
          EXTRA_OPTS+=("--with-json-mode=${{ matrix.json_mode }}")

          if [ "${{ matrix.json_debug }}" = "true" ]; then
            EXTRA_OPTS+=("--enable-json-backend-debug")
          fi

          printf 'Configure options:\n'
          printf '  %s\n' "${EXTRA_OPTS[@]}"

          ./configure --enable-assertions=yes "${EXTRA_OPTS[@]}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate configure result
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.configure_json.outputs.status }}"
          expect_fail="${{ matrix.expect_configure_failure }}"

          echo "configure status: $status"
          echo "expect failure: $expect_fail"

          if [ "$expect_fail" = "true" ]; then
            test "$status" -ne 0
            exit 0
          fi

          test "$status" -eq 0

      - uses: ammaraskar/gcc-problem-matcher@master
        if: ${{ matrix.expect_configure_failure == false }}

      - name: Compile
        if: ${{ matrix.expect_configure_failure == false }}
        run: make -j "$(nproc)"

      - name: Run tests
        if: ${{ matrix.expect_configure_failure == false }}
        run: make check

