      - name: Run build preparation script
        run: ./build.sh

      - name: Configure
        run: ./configure ${{ matrix.configure.opt }} --enable-assertions=yes

      - uses: ammaraskar/gcc-problem-matcher@master

      - name: Compile
        run: make -j "$(sysctl -n hw.logicalcpu)"

      - name: Run tests
        run: make check

