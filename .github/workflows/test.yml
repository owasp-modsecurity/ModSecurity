  build-windows:
    name: Windows (${{ matrix.platform.label }}, ${{ matrix.configure.label }})
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: "x64", arch: "x86_64" }
        configuration: [Release]
        configure:
          - { label: "full",             opt: "" }
