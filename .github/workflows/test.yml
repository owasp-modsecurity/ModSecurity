          - label: "auto/auto prefer=auto mode=auto"
            json_c: "auto"
            json_cxx: "auto"
            json_prefer: "auto"
            json_mode: "auto"
            json_debug: false
            expect_configure_failure: false

          - label: "auto/auto prefer=system mode=dom"
            json_c: "auto"
            json_cxx: "auto"
            json_prefer: "system"
            json_mode: "dom"
            json_debug: false
