name: Quality Assurance

on:
  push:
  pull_request:

jobs:
  build-linux:
    name: Build / ${{ matrix.os }} / ${{ matrix.platform.label }} / ${{ matrix.compiler.cc }} / ${{ matrix.configure.label }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      CFLAGS: ${{ matrix.platform.flags }} -Wformat -Werror=format-security
      CXXFLAGS: ${{ matrix.platform.flags }}
      LDFLAGS: ${{ matrix.platform.flags }}
      PKG_CONFIG_PATH: ""
      PKG_CONFIG_LIBDIR: /usr/lib/${{ matrix.platform.triplet }}-linux-gnu/pkgconfig:/usr/share/pkgconfig
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        platform:
          - {label: "x32", arch: "i386", triplet: "i386", flags: "-m32", bits: 32}
          - {label: "x64", arch: "amd64", triplet: "x86_64", flags: "", bits: 64}
        compiler:
          - {cc: "gcc", cxx: "g++"}
          - {cc: "clang", cxx: "clang++"}
        configure:
          - {label: "with pcre2, no study, no jit",      opt: "--enable-pcre-study=no" }
          - {label: "with pcre2, with study, no jit",    opt: "--enable-pcre-study=yes" }
          - {label: "with pcre2, no study, with jit",    opt: "--enable-pcre-study=no --enable-pcre-jit" }
          - {label: "with pcre2, with study, with jit",  opt: "--enable-pcre-study=yes --enable-pcre-jit" }
          - {label: "with pcre",                         opt: "--with-pcre --enable-pcre-study=no" }
          - {label: "with pcre, with study, no jit",     opt: "--with-pcre --enable-pcre-study=yes" }
          - {label: "with pcre, no study, with jit",     opt: "--with-pcre --enable-pcre-study=no --enable-pcre-jit" }
          - {label: "with pcre, with study, with jit",   opt: "--with-pcre --enable-pcre-study=yes --enable-pcre-jit" }
          - {label: "with lua",                          opt: "--with-lua" }
          - {label: "wo lua",                            opt: "--without-lua" }
        exclude:
          # Only Ubuntu 22.04 retains 32-bit Apache coverage.
          - os: ubuntu-24.04
            platform: {label: "x32", arch: "i386", triplet: "i386", flags: "-m32", bits: 32}
          - os: ubuntu-26.04
            platform: {label: "x32", arch: "i386", triplet: "i386", flags: "-m32", bits: 32}
          # Ubuntu 26.04 no longer provides PCRE1 development packages.
          - os: ubuntu-26.04
            configure: {label: "with pcre",                         opt: "--with-pcre --enable-pcre-study=no" }
          - os: ubuntu-26.04
            configure: {label: "with pcre, with study, no jit",     opt: "--with-pcre --enable-pcre-study=yes" }
          - os: ubuntu-26.04
            configure: {label: "with pcre, no study, with jit",     opt: "--with-pcre --enable-pcre-study=no --enable-pcre-jit" }
          - os: ubuntu-26.04
            configure: {label: "with pcre, with study, with jit",   opt: "--with-pcre --enable-pcre-study=yes --enable-pcre-jit" }
    steps:
      - name: Enable i386 dependencies
        if: matrix.platform.label == 'x32'
        run: sudo dpkg --add-architecture i386
      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi
          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"
          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package"
            exit 1
          fi
          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"
      - name: Setup Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential clang autoconf automake libtool pkg-config file \
            apache2:${{ matrix.platform.arch }} \
            apache2-bin:${{ matrix.platform.arch }} apache2-data \
            apache2-dev:${{ matrix.platform.arch }} \
            libxml2-dev:${{ matrix.platform.arch }} \
            ${{ steps.detect_lua.outputs.lua_pkg }}:${{ matrix.platform.arch }} \
            libcurl4-gnutls-dev:${{ matrix.platform.arch }} \
            libpcre2-dev:${{ matrix.platform.arch }} \
            libyajl-dev:${{ matrix.platform.arch }}
      - name: Setup 32-bit compiler support
        if: matrix.platform.label == 'x32'
        run: sudo apt-get install -y gcc-multilib g++-multilib
      - name: Install PCRE1 development package
        if: matrix.os != 'ubuntu-26.04'
        run: sudo apt-get install -y libpcre3-dev:${{ matrix.platform.arch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: autogen.sh
        run: ./autogen.sh
      - name: configure ${{ matrix.configure.label }}
        run: ./configure --enable-assertions ${{ matrix.configure.opt }}
      - uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master (2026-03-12)
      - name: make
        run: make -j "$(nproc)"
      - name: Check binary architecture
        run: |
          file apache2/.libs/mod_security2.so | grep -F 'ELF ${{ matrix.platform.bits }}-bit'
          file /usr/sbin/apache2 | grep -F 'ELF ${{ matrix.platform.bits }}-bit'
      - name: install module
        run: sudo make install
      - name: prepare config
        run: |
          sudo cp .github/security2.conf /etc/apache2/mods-enabled/
          sudo cp modsecurity.conf-recommended /etc/apache2/modsecurity.conf
          sudo cp unicode.mapping /etc/apache2/
          sudo mkdir -p /var/cache/modsecurity
          sudo chown -R www-data:www-data /var/cache/modsecurity
      - name: first check config (to get syntax errors)
        run: sudo apachectl configtest
      - name: start apache with module
        run: sudo systemctl restart apache2.service
      - name: Search for errors/warnings in error log
        run: |
          # '|| :' handles the case grep doesn't match, otherwise the script exits with 1 (error)
          errors=$(grep -E ':(?error|warn)[]]' /var/log/apache2/error.log) || :
          if [[ -z "${errors}" ]]; then exit 0; fi
          echo "::error:: Found errors/warnings in error.log"
          echo "${errors}"
          exit 1
      - name: Check error.log
        run: |
          # Send requests & check log format
          # Valid request
          curl -s http://127.0.01/ > /dev/null || echo $?
          # Invalid request
          curl -s http://127.0.01/%2e%2f > /dev/null || echo $? 
          # Check log format
          grep -F ModSecurity < /var/log/apache2/error.log | grep -vP "^\[[^\]]+\] \[security2:[a-z]+\] \[pid [0-9]+:tid [0-9]+\] (?:\[client [0-9.:]+\] )?ModSecurity" || exit 0
          # grep -v succeeded => found some lines with invalid format
          exit 1
      - name: Show httpd error log
        if: always()
        run: sudo cat /var/log/apache2/error.log
      - name: Show mod_security2 audit log
        if: always()
        run: sudo cat /var/log/apache2/modsec_audit.log

