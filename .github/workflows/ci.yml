          - {label: "x64", arch: "amd64", triplet: "x86_64", flags: "", bits: 64}
        compiler:
          - {cc: "gcc", cxx: "g++"}
          - {cc: "clang", cxx: "clang++"}
        configure:
          - {label: "with pcre2, no study, no jit",      opt: "--enable-pcre-study=no" }
          - {label: "with pcre2, with study, no jit",    opt: "--enable-pcre-study=yes" }
          - {label: "with pcre2, no study, with jit",    opt: "--enable-pcre-study=no --enable-pcre-jit" }
          - {label: "with pcre2, with study, with jit",  opt: "--enable-pcre-study=yes --enable-pcre-jit" }
          - {label: "with pcre",                         opt: "--with-pcre --enable-pcre-study=no" }
          - {label: "with pcre, with study, no jit",     opt: "--with-pcre --enable-pcre-study=yes" }
          - {label: "with pcre, no study, with jit",     opt: "--with-pcre --enable-pcre-study=no --enable-pcre-jit" }
          - {label: "with pcre, with study, with jit",   opt: "--with-pcre --enable-pcre-study=yes --enable-pcre-jit" }
          - {label: "with lua",                          opt: "--with-lua" }
          - {label: "wo lua",                            opt: "--without-lua" }
        exclude:
          # Only Ubuntu 22.04 retains 32-bit Apache coverage.
          - os: ubuntu-24.04
            platform: {label: "x32", arch: "i386", triplet: "i386", flags: "-m32", bits: 32}
          - os: ubuntu-26.04
            platform: {label: "x32", arch: "i386", triplet: "i386", flags: "-m32", bits: 32}
          # Ubuntu 26.04 no longer provides PCRE1 development packages.
          - os: ubuntu-26.04
            configure: {label: "with pcre",                         opt: "--with-pcre --enable-pcre-study=no" }
          - os: ubuntu-26.04
            configure: {label: "with pcre, with study, no jit",     opt: "--with-pcre --enable-pcre-study=yes" }
          - os: ubuntu-26.04
            configure: {label: "with pcre, no study, with jit",     opt: "--with-pcre --enable-pcre-study=no --enable-pcre-jit" }
          - os: ubuntu-26.04
            configure: {label: "with pcre, with study, with jit",   opt: "--with-pcre --enable-pcre-study=yes --enable-pcre-jit" }
    steps:
      - name: Enable i386 dependencies
        if: matrix.platform.label == 'x32'
        run: sudo dpkg --add-architecture i386
      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi
          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"
          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package"
            exit 1
          fi
          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"
      - name: Setup Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential clang autoconf automake libtool pkg-config file \
