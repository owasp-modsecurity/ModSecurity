            apache2-bin:${{ matrix.platform.arch }} apache2-data \
            apache2-dev:${{ matrix.platform.arch }} \
            libxml2-dev:${{ matrix.platform.arch }} \
            ${{ steps.detect_lua.outputs.lua_pkg }}:${{ matrix.platform.arch }} \
            libcurl4-gnutls-dev:${{ matrix.platform.arch }} \
            libpcre2-dev:${{ matrix.platform.arch }} \
            libyajl-dev:${{ matrix.platform.arch }}
      - name: Setup 32-bit compiler support
        if: matrix.platform.label == 'x32'
        run: sudo apt-get install -y gcc-multilib g++-multilib
      - name: Install PCRE1 development package
        if: matrix.os != 'ubuntu-26.04'
