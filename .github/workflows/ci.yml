      - name: make
        run: make -j "$(nproc)"
      - name: Check binary architecture
        run: |
          file apache2/.libs/mod_security2.so | grep -F 'ELF ${{ matrix.platform.bits }}-bit'
          file /usr/sbin/apache2 | grep -F 'ELF ${{ matrix.platform.bits }}-bit'
      - name: install module
        run: sudo make install
      - name: run tests
        run: make test

  test-regression-linux:
    name: Regression / ${{ matrix.os }} / ${{ matrix.platform.label }} / ${{ matrix.compiler.cc }} / ${{ matrix.configure.label }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      CFLAGS: ${{ matrix.platform.flags }} -Wformat -Werror=format-security
      CXXFLAGS: ${{ matrix.platform.flags }}
      LDFLAGS: ${{ matrix.platform.flags }}
      PKG_CONFIG_PATH: ""
      PKG_CONFIG_LIBDIR: /usr/lib/${{ matrix.platform.triplet }}-linux-gnu/pkgconfig:/usr/share/pkgconfig
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        # ssdeep is not packaged for i386; keep regression coverage on x64.
        platform:
          - {label: "x64", arch: "amd64", triplet: "x86_64", flags: "", bits: 64}
        compiler:
          - {cc: "gcc", cxx: "g++"}
        configure:
          - {label: "with pcre2, with study, with jit",  opt: "--enable-pcre-study=yes --enable-pcre-jit" }
    steps:
      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi
          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"
          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package"
            exit 1
          fi
          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"
      - name: Setup Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential clang autoconf automake libtool pkg-config file \
            apache2:${{ matrix.platform.arch }} \
            apache2-bin:${{ matrix.platform.arch }} apache2-data \
            apache2-dev:${{ matrix.platform.arch }} \
            libxml2-dev:${{ matrix.platform.arch }} \
            ${{ steps.detect_lua.outputs.lua_pkg }}:${{ matrix.platform.arch }} \
            libcurl4-gnutls-dev:${{ matrix.platform.arch }} \
            libpcre2-dev:${{ matrix.platform.arch }} \
            libyajl-dev:${{ matrix.platform.arch }}
      - name: Install PCRE1 development package
        if: matrix.os != 'ubuntu-26.04'
        run: sudo apt-get install -y libpcre3-dev:${{ matrix.platform.arch }}
      - name: Setup regression dependencies
        run: sudo apt-get install -y perl libwww-perl ssdeep libfuzzy-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: autogen.sh
        run: ./autogen.sh
      - name: configure ${{ matrix.configure.label }}
        run: ./configure ${{ matrix.configure.opt }}
      - uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master (2026-03-12)
      - name: make
        run: make -j "$(nproc)"
      - name: Check binary architecture
        run: |
          file apache2/.libs/mod_security2.so | grep -F 'ELF ${{ matrix.platform.bits }}-bit'
          file /usr/sbin/apache2 | grep -F 'ELF ${{ matrix.platform.bits }}-bit'
      - name: install module
        run: sudo make install
      - name: run regression tests
        run: make test-regression

  cppcheck:
    runs-on: [ubuntu-24.04]
    container:
      image: debian:sid
    steps:
      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -y -qq
          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi
          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"
          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package"
            exit 1
          fi
          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"
      - name: Setup Dependencies
        run: |
              apt-get update -y -qq
              apt-get install -y --no-install-recommends build-essential \
              autoconf \
              automake \
              libtool \
              pkg-config \
              cppcheck \
              apache2-dev \
              libpcre2-dev \
              libapr1-dev \
              libaprutil1-dev \
              libxml2-dev \
              ${{ steps.detect_lua.outputs.lua_pkg }} \
              libyajl-dev \
              libfuzzy-dev \
              ssdeep \
              curl \
              ca-certificates \
              git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: configure
        run: |
          ./autogen.sh
          ./configure --with-apxs=/usr/bin/apxs
      - name: cppcheck
        run: |
          make check-static

