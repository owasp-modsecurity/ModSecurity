name: Flawfinder (C/C++)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: "20 2 * * 1"   # Weekly

permissions:
  contents: read
  security-events: write

jobs:
  flawfinder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (inkl. Submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Flawfinder
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder

      - name: Build source file list (robust excludes)
        shell: bash
        run: |
          set -euo pipefail

          EXCLUDE_FILE=".github/security-scan-excludes.txt"
          EXCLUDE_TMP="/tmp/excludes.txt"

          # 1) Excludes vorbereiten (falls Datei fehlt/leer ist -> leere exclude list)
          if [[ -f "$EXCLUDE_FILE" ]]; then
            # Kommentare/Leerzeilen entfernen, "./" davor setzen
            grep -vE '^\s*#|^\s*$' "$EXCLUDE_FILE" | sed 's|^|./|' > "$EXCLUDE_TMP" || true
          else
            : > "$EXCLUDE_TMP"
          fi

          # 2) Relevante Quellfiles finden
          find . \
            -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \) \
            > /tmp/all-src.txt

          # 3) Excludes anwenden (wenn exclude list leer -> einfach alles nehmen)
          if [[ -s "$EXCLUDE_TMP" ]]; then
            grep -v -F -f "$EXCLUDE_TMP" /tmp/all-src.txt > /tmp/flawfinder-files.txt || true
          else
            cp /tmp/all-src.txt /tmp/flawfinder-files.txt
          fi

          # 4) Falls nix übrig bleibt, nicht failen – nur warnen
          if [[ ! -s /tmp/flawfinder-files.txt ]]; then
            echo "No source files to scan after excludes."
          else
            echo "Files to scan: $(wc -l < /tmp/flawfinder-files.txt)"
          fi

      - name: Build Flawfinder file list (headers only)
        shell: bash
        run: |
          set -euo pipefail
          git ls-files 'headers/**' \
            | grep -E '\.(h|hh|hpp|hxx)$' \
            > /tmp/flawfinder-headers-files.txt || true

          echo "Header files to scan: $(wc -l < /tmp/flawfinder-headers-files.txt || echo 0)"


      - name: Run Flawfinder (SARIF, headers strict)
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s /tmp/flawfinder-headers-files.txt ]]; then
            echo "Skipping flawfinder headers: no files."
            echo '{"$schema":"https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"flawfinder","informationUri":"https://dwheeler.com/flawfinder/"}},"results":[]}]}' > flawfinder-headers.sarif
            exit 0
          fi

          echo "Flawfinder version:"
          flawfinder --version

          set +e
          xargs -a /tmp/flawfinder-headers-files.txt \
            flawfinder --sarif --minlevel=1 \
            > flawfinder-headers.sarif \
            2> flawfinder-headers.stderr
          rc=$?
          set -e

          echo "flawfinder exit code: $rc"
          if [[ -s flawfinder-headers.stderr ]]; then
            echo "---- flawfinder stderr ----"
            cat flawfinder-headers.stderr
            echo "---------------------------"
          fi

          echo "SARIF size: $(wc -c < flawfinder-headers.sarif) bytes"

          # Validate SARIF JSON
          if ! python3 -c 'import json; json.load(open("flawfinder-headers.sarif","r",encoding="utf-8"))' 2>/dev/null; then
            echo "Writing minimal SARIF because flawfinder output was not valid SARIF JSON."
            echo '{"$schema":"https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"flawfinder","informationUri":"https://dwheeler.com/flawfinder/"}},"results":[]}]}' > flawfinder-headers.sarif
          fi

          # 16 = findings found → OK
          if [[ $rc -ne 0 && $rc -ne 16 ]]; then
            exit $rc
          fi


      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: flawfinder-headers.sarif
          category: flawfinder-headers-strict
