name: Flawfinder (C/C++)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: "20 2 * * 1"   # Weekly

permissions:
  contents: read
  security-events: write

jobs:
  flawfinder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (inkl. Submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Flawfinder
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder

      - name: Build source file list (with excludes)
        run: |
          grep -v '^\s*#' .github/security-scan-excludes.txt \
            | sed 's|^|./|' > /tmp/excludes.txt

          find . \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            -type f \
            | grep -v -F -f /tmp/excludes.txt \
            > /tmp/flawfinder-files.txt

      - name: Run Flawfinder (SARIF)
        run: |
          flawfinder \
            --sarif \
            --quiet \
            --minlevel=1 \
            $(cat /tmp/flawfinder-files.txt) \
            > flawfinder.sarif

      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: flawfinder.sarif
          category: flawfinder
