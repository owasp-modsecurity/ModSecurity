name: OSV Scanner (Scheduled)

on:
  schedule:
    - cron: "30 3 * * 1"
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.1
    with:
      allow-no-lockfiles: true
