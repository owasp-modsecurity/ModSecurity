name: Semgrep (C/C++ SAST)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (inkl. Submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep

      - name: Fetch OSS C/C++ rules
        run: |
          git clone --depth 1 https://github.com/0xdea/semgrep-rules .semgrep-rules

      - name: Run Semgrep (SARIF, robust excludes)
        shell: bash
        run: |
          set -euo pipefail

          EXCLUDE_FILE=".github/security-scan-excludes.txt"
          EXCLUDES=""

          if [[ -f "$EXCLUDE_FILE" ]]; then
            while IFS= read -r line; do
              # Skip comments and empty lines
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
              EXCLUDES+=" --exclude $line"
            done < "$EXCLUDE_FILE"
          fi

          echo "Semgrep excludes: $EXCLUDES"

          semgrep scan \
            --config .semgrep-rules \
            $EXCLUDES \
            --sarif -o semgrep.sarif \
            .

      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
