name: CodeQL Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL C/C++
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"

          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found"
            exit 1
          fi

          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
            | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
            | sort -V \
            | tail -n1 \
            | awk '{print $2}'
          )"

          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            libtool \
            pkg-config \
            libyajl-dev \
            libcurl4-openssl-dev \
            liblmdb-dev \
            ${{ steps.detect_lua.outputs.lua_pkg }} \
            libmaxminddb-dev \
            libpcre2-dev \
            libxml2-dev \
            libfuzzy-dev \
            pcre2-utils \
            libpcre3-dev \
            bison \
            flex \
            python3 \
            python3-venv

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          queries: security-extended,security-and-quality

      - name: Build for CodeQL database
        run: |
          ./build.sh
          ./configure --enable-assertions=yes
          make -j"$(nproc)"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
