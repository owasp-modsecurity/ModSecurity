name: Quality Assurance - cppcheck

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run FULL cppcheck (make check-static). If false: only changed files."
        required: true
        default: "false"
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    #- cron: "15 2 * * 1" # montags 02:15 UTC (anpassen wenn du willst)
    - cron: "15 2 * * 1"  # montags

jobs:
  cppcheck-linux:
    name: cppcheck (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Setup Dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y \
            cppcheck \
            autoconf \
            automake \
            libtool

      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules are up to date
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Build-Script ausführbar machen
        run: chmod +x build_on_linux.sh

      - name: build_on_linux.sh
        run: ./build_on_linux.sh

      - name: configure
        run: ./configure --disable-dependency-tracking

      # FULL scan: scheduled ODER workflow_dispatch(full=true)
      - name: cppcheck (full)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full == 'true')
        run: make check-static JOBS=$(nproc)

      # FAST scan: Push/PR oder workflow_dispatch(full=false)
      - name: cppcheck (changed files)
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full == 'true')
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="master"
          fi

          git fetch origin "$BASE_REF" --depth=1 || true
          CHANGED="$(git diff --name-only "origin/$BASE_REF"...HEAD -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | tr '\n' ' ')"

          if [ -z "$CHANGED" ]; then
            echo "No changed C/C++ files detected."
            exit 0
          fi

          cppcheck --enable=warning,style,performance,portability \
            --inline-suppr --error-exitcode=1 \
            $CHANGED

  cppcheck-macos:
    name: cppcheck (macOS)
    runs-on: macos-14

    steps:
      - name: Setup Dependencies
        run: |
          brew update
          brew install autoconf automake libtool cppcheck mbedtls

      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules are up to date
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Build-Script ausführbar machen
        run: chmod +x build_on_macos.sh

      - name: build_on_macos.sh
        run: ./build_on_macos.sh

      - name: configure
        env:
          CPPFLAGS: -I/opt/homebrew/opt/mbedtls/include
          LDFLAGS: -L/opt/homebrew/opt/mbedtls/lib
        run: ./configure --disable-dependency-tracking

      # FULL scan: scheduled ODER workflow_dispatch(full=true)
      - name: cppcheck (full)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full == 'true')
        run: make check-static JOBS=$(sysctl -n hw.ncpu)

      # FAST scan: Push/PR oder workflow_dispatch(full=false)
      - name: cppcheck (changed files)
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full == 'true')
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="master"
          fi

          git fetch origin "$BASE_REF" --depth=1 || true
          CHANGED="$(git diff --name-only "origin/$BASE_REF"...HEAD -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | tr '\n' ' ')"

          if [ -z "$CHANGED" ]; then
            echo "No changed C/C++ files detected."
            exit 0
          fi

          cppcheck --enable=warning,style,performance,portability \
            --inline-suppr --error-exitcode=1 \
            $CHANGED
