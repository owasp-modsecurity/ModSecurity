name: "CodeQL config for ModSecurity"

queries:
  - uses: security-extended

paths-ignore:
  # Tests
  - "tests/**"
  - "test/**"
  - "**/*test*"

  # Third-party / submodules
  - "others/**"
  - "bindings/**"
  - "examples/**"
  - "doc/**"

  # Build & generated files
  - "build/**"
  - "**/*.png"
  - "**/*.md"
