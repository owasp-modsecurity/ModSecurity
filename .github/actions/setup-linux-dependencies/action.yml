name: Setup Linux dependencies
description: Install shared build dependencies and select the latest packaged Lua version.

inputs:
  extra-packages:
    description: Space-separated additional apt packages for this job.
    required: false
    default: ''
  lua-interpreter:
    description: Also install the interpreter matching the selected Lua development package.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        INSTALL_LUA_INTERPRETER: ${{ inputs.lua-interpreter }}
      run: |
        set -euo pipefail

        # Debian containers run as root and do not include sudo.
        privilege=()
        if [ "$(id -u)" -ne 0 ]; then
          privilege=(sudo)
        fi

        "${privilege[@]}" apt-get update -y -qq

        candidates="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
        if [ -z "$candidates" ]; then
          echo "No libluaX.Y-dev package found"
          exit 1
        fi

        lua_dev_package="$(
          printf '%s\n' "$candidates" \
          | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
          | sort -V \
          | tail -n1 \
          | awk '{print $2}'
        )"
        if [ -z "$lua_dev_package" ]; then
          echo "Failed to determine Lua development package"
          exit 1
        fi
        echo "Using Lua development package: $lua_dev_package"

        packages=(
          libyajl-dev libcurl4-openssl-dev liblmdb-dev "$lua_dev_package"
          libmaxminddb-dev libpcre2-dev libxml2-dev libfuzzy-dev pcre2-utils
          bison flex python3 python3-venv
        )
        if [ "$INSTALL_LUA_INTERPRETER" = true ]; then
          lua_interpreter="${lua_dev_package#lib}"
          lua_interpreter="${lua_interpreter%-dev}"
          packages+=("$lua_interpreter")
          echo "Using Lua interpreter: $lua_interpreter"
        fi

        read -r -a extra_packages <<< "$EXTRA_PACKAGES"
        packages+=("${extra_packages[@]}")
        "${privilege[@]}" apt-get install -y "${packages[@]}"
